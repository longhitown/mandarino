# BOZZA della ricetta F-Droid per màndarínō. Va proposta al repository «fdroiddata» (GitLab, https://gitlab.com/fdroid/fdroiddata)
# come metadata/it.mandarino.app.yml, con una merge request. Qui è una copia di lavoro: non viene letta da niente.
# Testi (titolo, descrizioni, immagini, note di versione): F-Droid li legge da fastlane/metadata/android/ nel repository dell'app.
# Spiegazioni, controlli ancora da fare e decisioni aperte: docs/store/f-droid.md.
#
# Prima di inviarla controlla in locale con gli strumenti di F-Droid (fdroidserver):
#   fdroid readmeta && fdroid rewritemeta it.mandarino.app && fdroid lint it.mandarino.app && fdroid build -v -l it.mandarino.app
# Nota: «Education» non è un nome di categoria di F-Droid; il più vicino è «Science & Education».

Categories:
  - Science & Education
License: MIT
WebSite: https://mandarinoapp.org/
SourceCode: https://github.com/longhitown/mandarino
IssueTracker: https://github.com/longhitown/mandarino/issues

AutoName: màndarínō

# Anti-caratteristiche, dichiarate in modo onesto (spiegazione in docs/store/f-droid.md):
# - NonFreeNet: la voce online facoltativa (spenta di base, la accende la persona in Impostazioni) legge il parlato dal servizio
#   di sintesi vocale di Google. Nella versione «store» è l'unica richiesta di rete verso un servizio non libero.
# Non servono: NonFreeDep (nessuna libreria di Google né di terzi nel pacchetto), Tracking, Ads, NonFreeAdd, UpstreamNonFree
# (il codice è MIT, i contenuti CC BY 4.0, i brani sono originali). Il riconoscimento vocale usa il servizio di sistema del telefono.
AntiFeatures:
  NonFreeNet:
    en-US: The optional online voice (off by default, switched on by the user in Settings) uses Google's text-to-speech service.
    it-IT: La voce online facoltativa (spenta di base, la accende la persona nelle impostazioni) usa il servizio di sintesi vocale di Google.

RepoType: git
Repo: https://github.com/longhitown/mandarino.git

Builds:
  - versionName: 0.9.0
    versionCode: 1000
    commit: r0.9.0
    subdir: android/app
    # dist/ (l'app web che finisce nel pacchetto) si costruisce con Node: solo moduli integrati, nessun pacchetto npm, nessuna rete.
    # Serve Node 20 o più recente (engines di package.json): CONTROLLA quale versione dà apt nella buildserver in uso.
    sudo:
      - apt-get update
      - apt-get install -y nodejs
    gradle:
      - store
    # il prebuild gira in android/app: tools/ sta due cartelle più su
    prebuild:
      - node --version
      - node ../../tools/build.mjs
    output: build/outputs/apk/store/release/app-store-release.apk

# Build riproducibili (F-Droid pubblica l'APK firmato da noi se identico a quello costruito da lui): ATTIVE dal 1 novembre 2026: la chiave c'è e la release r0.9.0 è firmata con quella (impronta qui sotto). Che l'APK store si
# ricostruisca uguale lo verifica la CI di F-Droid sulla merge request.
# Il segnaposto è l'impronta SHA-256 del certificato (64 cifre esadecimali minuscole, senza due punti): è quella che il workflow
# «release» scrive nel riepilogo di ogni corsa. Non è un segreto.
Binaries: https://github.com/longhitown/mandarino/releases/download/r%v/mandarino-store.apk
AllowedAPKSigningKeys: e706415ebf0e7143b68a3db3258e445bf34f03d04319d12850da3af3703ce59d

# Come F-Droid scopre le versioni nuove: i tag r<x.y.z> (non i v6.7.N delle build per push) e il file android/version.properties
# (righe semplici versionCode=… e versionName=…, scritte da tools/release.mjs).
AutoUpdateMode: Version r%v
UpdateCheckMode: Tags ^r\d+\.\d+\.\d+$
UpdateCheckData: android/version.properties|versionCode=(\d+)|.|versionName=(.*)
CurrentVersion: 0.9.0
CurrentVersionCode: 1000
