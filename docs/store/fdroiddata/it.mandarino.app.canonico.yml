AntiFeatures:
  NonFreeNet:
    en-US: The optional online voice (off by default, switched on by the user in Settings)
      uses Google's text-to-speech service.
    it-IT: La voce online facoltativa (spenta di base, la accende la persona nelle
      impostazioni) usa il servizio di sintesi vocale di Google.
Categories:
  - Science & Education
License: MIT
WebSite: https://mandarinoapp.org/
SourceCode: https://github.com/longhitown/mandarino
IssueTracker: https://github.com/longhitown/mandarino/issues

AutoName: màndarínō

RepoType: git
Repo: https://github.com/longhitown/mandarino.git

Builds:
  - versionName: 0.9.0
    versionCode: 1000
    commit: r0.9.0
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y nodejs
    gradle:
      - store
    output: build/outputs/apk/store/release/app-store-release.apk
    prebuild:
      - node --version
      - node ../../tools/build.mjs

AutoUpdateMode: Version r%v
UpdateCheckMode: Tags ^r\d+\.\d+\.\d+$
UpdateCheckData: android/version.properties|versionCode=(\d+)|.|versionName=(.*)
CurrentVersion: 0.9.0
CurrentVersionCode: 1000
