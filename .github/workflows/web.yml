# màndarínō · prove dell'app web a ogni push e pull request:
# - prove veloci senza browser (tools/unit.mjs: taglio in parole, unione dei dati, peso dell'avvio);
# - la build (dist/ non sta nel repository: si costruisce qui, così le pull request non litigano su un file generato) e le frasi verificate;
# - prove nel browser vero (tools/e2e.mjs, tools/ux-audit.mjs) con Playwright, dichiarato in package.json.
name: web

on:
  push:
    paths: ["src/**", "tools/**", "icone/**", "MARCHIO.md", "package.json", ".github/workflows/web.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build (dati, lezioni e frasi controllati) e frasi verificate
        run: node tools/build.mjs && node tools/grammar.mjs

      - name: Prove veloci (senza browser)
        run: node tools/unit.mjs

      # Il 31 ottobre e il 1 novembre 2026 questo passo è caduto due volte: la prima rimase appeso 30 minuti, la seconda `apt-get update`
      # non riusciva a raggiungere lo specchio di Ubuntu del server (azure.archive.ubuntu.com); il «timeout» uccise apt lasciando il
      # blocco acceso, e i due tentativi dopo fallirono per quello («Could not get lock»). Quindi:
      #  1. il browser si scarica da solo, senza apt (con cache e tre tentativi: scaricare un file si può interrompere senza danni);
      #  2. le librerie di sistema di solito ci sono già (il server ha Chrome): si installano con apt solo se Chromium non parte;
      #  3. apt non si uccide mai da fuori: ha i suoi tempi massimi (20 secondi e tre tentativi) e finisce da solo.
      - name: Cache dei browser di Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Playwright e Chromium
        timeout-minutes: 15
        run: |
          npm install --no-audit --no-fund
          for i in 1 2 3; do
            if timeout 180 npx playwright install chromium; then break; fi
            echo "::warning::Playwright: scarico del browser, tentativo $i fallito o troppo lento"
            [ "$i" = 3 ] && { echo "::error::Playwright: non sono riuscito a scaricare Chromium in tre tentativi"; exit 1; }
            sleep 10
          done
          provo() { node -e "require('playwright').chromium.launch().then(b=>b.close()).catch(e=>{console.error(String(e.message).split('\n')[0]);process.exit(1)})"; }
          if provo; then echo "Chromium parte: le librerie di sistema ci sono già"; exit 0; fi
          echo "::warning::Chromium non parte: installo le librerie di sistema"
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' | sudo tee /etc/apt/apt.conf.d/99-ci >/dev/null
          for i in 1 2 3; do
            if npx playwright install-deps chromium; then break; fi
            echo "::warning::Playwright: librerie di sistema, tentativo $i fallito"
            [ "$i" = 3 ] && { echo "::error::Playwright: non sono riuscito a installare le librerie di sistema"; exit 1; }
            sleep 20
          done
          provo

      - name: Prove nel browser
        # un solo nuovo tentativo se la prova fallisce: un guasto vero fallisce due volte, un'incertezza del browser di prova (visto solo nella CI) no
        run: |
          node tools/e2e.mjs || { echo "::warning::e2e: primo tentativo fallito, ne faccio un secondo"; node tools/e2e.mjs; }
          node tools/ux-audit.mjs
