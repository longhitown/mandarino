# màndarínō · sito su GitHub Pages: la pagina di presentazione (docs/index.html) alla radice, privacy.html ricavata da
# PRIVACY.md e l'app (dist/) in app/. Tutto lo mette insieme tools/site.mjs.
# Una volta sola: Settings → Pages → Build and deployment → Source: «GitHub Actions».
# Parte a ogni push sul ramo principale che tocca l'app o la pagina, a ogni nuova Release (così l'APK sul sito è sempre l'ultimo; la Release
# creata dal workflow «APK Android» lo lancia con workflow_dispatch) o a mano (Actions → pages → Run workflow).
# Niente chiavi né segreti: usa solo il token del workflow, con i permessi minimi di Pages.
name: pages

on:
  push:
    branches: [main]
    paths: ["src/**", "docs/index.html", "docs/404.html", "docs/assets/**", "docs/audio/**", "docs/licenze/**", "docs/zh/**", "docs/icon.svg", "docs/img/**", "docs/ai/**", "docs/fatti.json", "src/data/social.js", "PRIVACY.md", "MANIFESTO.md", "tools/build.mjs", "tools/site.mjs", "tools/seo.mjs", "tools/fatti.mjs", ".github/workflows/pages.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # un deploy già avviato finisce; in coda resta solo l’ultimo (gli altri risultano «annullati»: è normale)

jobs:
  sito:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # la storia serve a tools/seo.mjs per le date di ultima modifica (lastmod) della mappa del sito

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Costruisce l'app e mette insieme il sito
        run: node tools/build.mjs && node tools/site.mjs --out _site

      - name: Aggiunge l'APK dell'ultima Release (se c'è)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download --repo "$GITHUB_REPOSITORY" --pattern mandarino.apk --dir _site; then
            (cd _site && sha256sum mandarino.apk > mandarino.apk.sha256)
            ls -l _site/mandarino.apk
          else
            echo "Nessuna Release con mandarino.apk: il sito esce senza. La pagina rimanda a GitHub."
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
